name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: bin/build
      - run: gem push pkg/riffer-*.gem

  docs:
    runs-on: ubuntu-latest
    needs: release
    # always() lets a manual dispatch deploy docs even though the release job
    # is skipped for that event. The ref gate keeps docs deploying only ever
    # from main — the deploy force-pushes gh-pages, so a dispatch from a
    # feature branch would overwrite the live site with WIP docs.
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/docs
      - uses: JamesIves/github-pages-deploy-action@65b5dfd4f5bcd3a7403bbc2959c144256167464e
        with:
          branch: gh-pages
          folder: ./_site
