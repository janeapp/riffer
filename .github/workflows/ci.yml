name: ci

on:
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/lint

  test:
    runs-on: ubuntu-latest
    name: test ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/test

  test-evals:
    runs-on: ubuntu-latest
    name: test-evals ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    defaults:
      run:
        working-directory: riffer-evals

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      # Not bundler-cache: it installs in deployment mode, which fails once a
      # riffer release bumps the version this lockfile records for riffer's path.
      - run: bundle install
      - run: bin/test

  test-no-otel:
    runs-on: ubuntu-latest

    env:
      BUNDLE_WITHOUT: opentelemetry

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/test

  rbs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Generate RBS files
        run: bin/rbs
      - name: Check for RBS drift
        run: git diff --exit-code sig/generated/
      - name: Update RBS collection
        run: bundle exec rbs collection update
      - name: Check for rbs collection lock drift
        run: git diff --exit-code rbs_collection.lock.yaml
      - name: Run Steep type check
        run: bin/typecheck

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rake docs:check
