# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

gems:
  # riffer's own signatures are loaded by the Steepfile (sig/generated etc.) —
  # installing them through the collection too would duplicate every declaration.
  - name: riffer
    ignore: true
  # Not in Gemfile.lock (psych is the gem), but lib/ references YAML directly.
  - name: yaml
  # CGI.escapeHTML lives in the cgi-escape stdlib sigs, not the cgi gem's.
  - name: cgi-escape
