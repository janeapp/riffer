# Dependency signatures come from ruby/gem_rbs_collection, resolved against
# Gemfile.lock. The source is pinned to a commit so `rbs collection update` is
# deterministic — the lock only moves when Gemfile.lock does. Bump the SHA
# deliberately to pull newer upstream stubs.
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: 3913b7dffb65bdffdfe5cb9095108f932e85433b
    repo_dir: gems

path: .gem_rbs_collection

# `yaml` is stdlib rather than a Gemfile.lock entry, so it has to be requested
# by hand; every other dependency is discovered from the lock.
gems:
  - name: yaml
